name: build-references
# Builds the reference signature library on GitHub's runner and commits the compact index.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/models
          key: models-v1-birdnet31-geo304
      - run: python tools/fetch_models.py /home/runner/models
      - run: python -u tools/build_references.py /home/runner/models /home/runner/refs
      - name: Publish raw clips (provenance) and commit index
        run: |
          cd /home/runner/refs && zip -q -r references-v1-clips.zip clips manifest.json && cd -
          gh release delete references-v1 -y 2>/dev/null || true
          gh release create references-v1 /home/runner/refs/references-v1-clips.zip /home/runner/refs/manifest.json \
            --title "Reference signature library v1 (raw clips)" --notes "Openly licensed Wikimedia Commons recordings used by EchoMap's reverse sound search. Per-file licence, author and source in manifest.json." --prerelease
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add echomap/data/references.json.gz
          git diff --cached --quiet && echo "no changes" || (git commit -m "Reference signature library (build-references workflow)" && git pull --rebase && git push)
