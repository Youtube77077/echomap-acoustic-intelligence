name: build-data
# Regenerates echomap/data/* from data-sources/ on GitHub's runner and commits the result.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install numpy==2.5.4 shapely==2.2.0
      - run: python tools/build_data.py
      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add echomap/data
          git diff --cached --quiet && echo "no changes" || (git commit -m "Regenerate datasets (build-data workflow)" && git push)
