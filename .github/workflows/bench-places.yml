name: bench-places
# Place test: one real recording made near each named place (Derry, Dublin), Deep analysis, errors, screenshots.
# (committed to docs/eval and docs/screenshots/bench). Runs on GitHub's machines only.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/bench-places.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      LOCALAPPDATA: /home/runner/appdata
      WIKIMEDIA_CONTACT: ${{ vars.WIKIMEDIA_CONTACT }}
      BENCH_NAME: ireland
      BENCH_PLACES: "Derry:54.9966,-7.3086;Dublin:53.3498,-6.2603"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt playwright==1.58.0 && python -m playwright install --with-deps chromium
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: /home/runner/appdata/EchoMap/models
          key: models-v1-birdnet31-geo304-asr1
      - run: python tools/fetch_models.py "$LOCALAPPDATA/EchoMap/models"
      - run: gh release download images-v1 -p "EchoMap-images-v1.zip" -D "$LOCALAPPDATA/EchoMap/models" --clobber || echo "no picture pack yet"
      - run: gh release download transit-lines-v1 -p "EchoMap-transit-full-v1.sqlite.gz" -D "$LOCALAPPDATA/EchoMap/models" --clobber || echo "no transit pack yet"
      - run: python -u tools/soundscape_bench.py "$LOCALAPPDATA/EchoMap/models" /home/runner/bench
      - name: Commit results and screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/eval/soundscape_set_ireland.json docs/eval/soundscapes_ireland.json docs/eval/SOUNDSCAPES_ireland.md docs/screenshots/bench_ireland || true
          git commit -m "Place test (Derry, Dublin): results and screenshots" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
