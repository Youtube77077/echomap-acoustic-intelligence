name: build-windows
# Builds EchoMap.exe on GitHub's Windows runner, tests it, packages it, and (on tags or manual
# request) publishes a GitHub Release. Nothing is built on the user's PC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<version>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ECHOMAP_MODELS: ${{ github.workspace }}\ci_models
      ECHOMAP_AUDIO: ${{ github.workspace }}\ci_audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install approved dependencies (runner only)
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.22.3
      - uses: actions/cache@v4
        with:
          path: ci_models
          key: win-models-v1-birdnet31-geo304
      - run: python tools/fetch_models.py ci_models
      - uses: actions/cache@v4
        with:
          path: ci_audio
          key: win-audio-${{ hashFiles('tests/test_audio_manifest.json') }}
      - run: python tools/fetch_test_audio.py ci_audio
      - name: Tests on Windows
        run: python -m pytest -q -rA tests
      - name: Build EchoMap.exe (PyInstaller, one-folder)
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --clean packaging/echomap.spec
      - name: Smoke-test the built executable
        shell: pwsh
        run: |
          $env:ECHOMAP_HEADLESS_FILE = "$env:RUNNER_TEMP\echomap_url.txt"
          $p = Start-Process -FilePath "dist\EchoMap\EchoMap.exe" -PassThru
          for ($i=0; $i -lt 60 -and -not (Test-Path $env:ECHOMAP_HEADLESS_FILE); $i++) { Start-Sleep -Milliseconds 500 }
          $url, $tok = (Get-Content $env:ECHOMAP_HEADLESS_FILE -Raw).Trim().Split(" ")
          $r = Invoke-RestMethod -Uri ($url + "api/status") -Headers @{"X-EchoMap-Token"=$tok}
          if ($r.state -ne "idle") { throw "unexpected state $($r.state)" }
          $bad = try { Invoke-WebRequest -Uri ($url + "api/status") -UseBasicParsing; "open" } catch { "blocked" }
          if ($bad -ne "blocked") { throw "API answered without token" }
          $html = Invoke-WebRequest -Uri $url -UseBasicParsing
          if ($html.Content -notmatch "Detection inventory") { throw "UI not served" }
          Stop-Process -Id $p.Id -Force
          "Smoke test passed"
      - name: UI test with real analysis and screenshots (Edge headless, preinstalled on runner)
        shell: pwsh
        run: |
          $env:ECHOMAP_HEADLESS_FILE = "$env:RUNNER_TEMP\echomap_url2.txt"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "appdata"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\EchoMap" | Out-Null
          @{models_dir = (Join-Path $env:GITHUB_WORKSPACE "ci_models")} | ConvertTo-Json | Out-File -Encoding ascii (Join-Path $env:LOCALAPPDATA "EchoMap\config.json")
          $p = Start-Process -FilePath "dist\EchoMap\EchoMap.exe" -PassThru
          for ($i=0; $i -lt 60 -and -not (Test-Path $env:ECHOMAP_HEADLESS_FILE); $i++) { Start-Sleep -Milliseconds 500 }
          $url, $tok = (Get-Content $env:ECHOMAP_HEADLESS_FILE -Raw).Trim().Split(" ")
          $h = @{"X-EchoMap-Token"=$tok; "Content-Type"="application/json"}
          $clip = "$env:GITHUB_WORKSPACE\ci_audio\soundscape.wav"
          Invoke-RestMethod -Method Post -Uri ($url + "api/open") -Headers $h -Body (@{path=$clip} | ConvertTo-Json) | Out-Null
          Invoke-RestMethod -Method Post -Uri ($url + "api/analyse") -Headers $h -Body "{}" | Out-Null
          for ($i=0; $i -lt 240; $i++) { $s = Invoke-RestMethod -Uri ($url + "api/status") -Headers $h; if ($s.state -in @("analysed","error")) { break }; Start-Sleep 1 }
          if ($s.state -ne "analysed") { throw "analysis state $($s.state): $($s.error)" }
          $ctx = '{"context": {"date": {"mode": "unknown"}, "location": {"mode": "unknown"}}}'
          Invoke-RestMethod -Method Post -Uri ($url + "api/context") -Headers $h -Body $ctx | Out-Null
          for ($i=0; $i -lt 240; $i++) { $s = Invoke-RestMethod -Uri ($url + "api/status") -Headers $h; if ($s.state -in @("complete","error")) { break }; Start-Sleep 1 }
          if ($s.state -ne "complete") { throw "context state $($s.state): $($s.error)" }
          $r = Invoke-RestMethod -Uri ($url + "api/result") -Headers $h
          "Inventory records: $($r.result.inventory.Count); geo: $($r.result.geo.summary)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $sp = Invoke-WebRequest -UseBasicParsing -Uri ($url + "api/spectrogram?t0=0&t1=120&fmin=0&fmax=16000&scale=linear&w=800&h=300") -Headers $h
          $meta = $sp.Headers["X-Meta"] | ConvertFrom-Json
          if ($sp.RawContentLength -ne 800*300 -or $meta.width -ne 800) { throw "spectrogram API returned $($sp.RawContentLength) bytes" }
          $nonzero = ($sp.Content | Where-Object { $_ -gt 0 }).Count
          "Spectrogram API: 800x300 bytes, n_fft $($meta.n_fft), non-zero pixels $nonzero" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($nonzero -lt 10000) { throw "spectrogram is (nearly) empty" }
          if (-not $r.result.geo.candidates -or $r.result.geo.candidates.Count -lt 1) { throw "no geo candidates for the soundscape" }
          $rep = Invoke-WebRequest -UseBasicParsing -Uri ($url + "api/report") -Headers $h
          if ($rep.Content -notmatch "Full processing history") { throw "report incomplete" }
          "Report HTML: $([math]::Round($rep.RawContentLength/1KB)) KB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          New-Item -ItemType Directory -Force screenshots | Out-Null
          foreach ($tab in @("analysis","inventory","geo","report")) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1480,940 --virtual-time-budget=60000 --timeout=45000 --run-all-compositor-stages-before-draw "--screenshot=$PWD\screenshots\$tab.png" ($url + "#tab=$tab") 2>$null
            Start-Sleep 2
          }
          Get-ChildItem screenshots | Select-Object Name, Length | Format-Table
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/*.png
          retention-days: 14
      - name: Package
        shell: pwsh
        run: |
          $ver = (python -c "from echomap import config; print(config.APP_VERSION)").Trim()
          "VER=$ver" | Out-File -Append $env:GITHUB_ENV
          Copy-Item docs\INSTALL.md dist\EchoMap\INSTALL.md
          Copy-Item THIRD_PARTY_NOTICES.md dist\EchoMap\
          New-Item -ItemType Directory dist\EchoMap\models | Out-Null
          "Extract EchoMap-models-*.zip here (or choose another folder in Models & settings)." | Out-File dist\EchoMap\models\PUT_MODELS_HERE.txt
          Compress-Archive -Path dist\EchoMap -DestinationPath "EchoMap-v$ver-win64.zip"
          Compress-Archive -Path ci_models\* -DestinationPath "EchoMap-models-v2.zip"
          Get-ChildItem *.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}} | Format-Table
          $app = (Get-ChildItem "EchoMap-v$ver-win64.zip").Length/1MB
          "App ZIP size: {0:N1} MB" -f $app >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: EchoMap-win64
          path: EchoMap-v*-win64.zip
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        run: |
          $tag = "v$env:VER"
          gh release create $tag "EchoMap-v$env:VER-win64.zip" "EchoMap-models-v2.zip" --title "EchoMap $tag" --notes-file docs/RELEASE_NOTES.md --target $env:GITHUB_SHA
