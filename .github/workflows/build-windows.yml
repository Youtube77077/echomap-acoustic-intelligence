name: build-windows
# Builds EchoMap.exe on GitHub's Windows runner, tests it, packages it, and (on tags or manual
# request) publishes a GitHub Release. Nothing is built on the user's PC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<version>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ECHOMAP_MODELS: ${{ github.workspace }}\ci_models
      ECHOMAP_AUDIO: ${{ github.workspace }}\ci_audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install approved dependencies (runner only)
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.22.3
      - uses: actions/cache@v4
        with:
          path: ci_models
          key: win-models-v1-birdnet31-geo304
      - run: python tools/fetch_models.py ci_models
      - uses: actions/cache@v4
        with:
          path: ci_audio
          key: win-audio-${{ hashFiles('tests/test_audio_manifest.json') }}
      - run: python tools/fetch_test_audio.py ci_audio
      - name: Tests on Windows
        run: python -m pytest -q -rA tests
      - name: Build EchoMap.exe (PyInstaller, one-folder)
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm --clean packaging/echomap.spec
      - name: Smoke-test the built executable
        shell: pwsh
        run: |
          $env:ECHOMAP_HEADLESS_FILE = "$env:RUNNER_TEMP\echomap_url.txt"
          $p = Start-Process -FilePath "dist\EchoMap\EchoMap.exe" -PassThru
          for ($i=0; $i -lt 60 -and -not (Test-Path $env:ECHOMAP_HEADLESS_FILE); $i++) { Start-Sleep -Milliseconds 500 }
          $url, $tok = (Get-Content $env:ECHOMAP_HEADLESS_FILE -Raw).Trim().Split(" ")
          $r = Invoke-RestMethod -Uri ($url + "api/status") -Headers @{"X-EchoMap-Token"=$tok}
          if ($r.state -ne "idle") { throw "unexpected state $($r.state)" }
          $bad = try { Invoke-WebRequest -Uri ($url + "api/status") -UseBasicParsing; "open" } catch { "blocked" }
          if ($bad -ne "blocked") { throw "API answered without token" }
          $html = Invoke-WebRequest -Uri $url -UseBasicParsing
          if ($html.Content -notmatch "Detection inventory") { throw "UI not served" }
          Stop-Process -Id $p.Id -Force
          "Smoke test passed"
      - name: Package
        shell: pwsh
        run: |
          $ver = (python -c "from echomap import config; print(config.APP_VERSION)").Trim()
          "VER=$ver" | Out-File -Append $env:GITHUB_ENV
          Copy-Item docs\INSTALL.md dist\EchoMap\INSTALL.md
          Copy-Item THIRD_PARTY_NOTICES.md dist\EchoMap\
          New-Item -ItemType Directory dist\EchoMap\models | Out-Null
          "Extract EchoMap-models-*.zip here (or choose another folder in Models & settings)." | Out-File dist\EchoMap\models\PUT_MODELS_HERE.txt
          Compress-Archive -Path dist\EchoMap -DestinationPath "EchoMap-v$ver-win64.zip"
          Compress-Archive -Path ci_models\* -DestinationPath "EchoMap-models-v1.zip"
          Get-ChildItem *.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}} | Format-Table
          $app = (Get-ChildItem "EchoMap-v$ver-win64.zip").Length/1MB
          "App ZIP size: {0:N1} MB" -f $app >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: EchoMap-win64
          path: EchoMap-v*-win64.zip
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        run: |
          $tag = "v$env:VER"
          gh release create $tag "EchoMap-v$env:VER-win64.zip" "EchoMap-models-v1.zip" --title "EchoMap $tag" --notes-file docs/RELEASE_NOTES.md --target $env:GITHUB_SHA
