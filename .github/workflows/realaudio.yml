name: realaudio
# End-to-end test of the real pipeline on real audio (Dutch speech, street sounds, a 5-minute clip),
# in each analysis mode, with timings and profiles. Runs on GitHub's machines only.
on:
  push:
    branches: ["claude/**", "v1.0.8-dev"]
    paths: ["echomap/**", "tools/profile_case.py", "tools/make_real_audio.py", "tests/test_real_pipeline.py", "tests/test_video_ingest.py", ".github/workflows/realaudio.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [quick, standard, deep]
        file: [dutch_speech.wav, street_dutch.wav, street_dutch.mp4, long_mix.wav]
    env:
      GH_TOKEN: ${{ github.token }}
      LOCALAPPDATA: /home/runner/appdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pytest
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: /home/runner/appdata/EchoMap/models
          key: models-v1-birdnet31-geo304-asr1
      - run: python tools/fetch_models.py "$LOCALAPPDATA/EchoMap/models"
      - name: Cache real audio
        uses: actions/cache@v4
        with:
          path: /home/runner/real
          key: real-audio-${{ hashFiles('tools/make_real_audio.py') }}
      - run: test -f /home/runner/real/street_dutch.mp4 || python tools/make_real_audio.py /home/runner/real
      - name: Profile ${{ matrix.mode }} ${{ matrix.file }}
        run: ECHOMAP_STACKDUMP=150 timeout -s KILL 600 python -u tools/profile_case.py "/home/runner/real/${{ matrix.file }}" ${{ matrix.mode }} out.json
      - name: End-to-end assertions
        if: hashFiles('tests/test_real_pipeline.py') != ''
        env:
          ECHOMAP_PROFILE_JSON: out.json
          ECHOMAP_FILE: ${{ matrix.file }}
        run: python -m pytest -q tests/test_real_pipeline.py -rA
