name: realaudio
# End-to-end test of the real pipeline on real audio (Dutch speech, street sounds, a 5-minute clip),
# in each analysis mode, with timings and profiles. Runs on GitHub's machines only.
on:
  push:
    branches: ["claude/**", "v1.0.8-dev"]
    paths: ["echomap/**", "tools/profile_case.py", "tools/make_real_audio.py", "tests/test_real_pipeline.py", ".github/workflows/realaudio.yml"]
  workflow_dispatch:
    inputs:
      modes:
        description: "Space-separated modes"
        default: "quick standard deep"
      files:
        description: "Space-separated files (dutch_speech.wav street_dutch.wav long_mix.wav)"
        default: "dutch_speech.wav street_dutch.wav long_mix.wav"
      assert:
        description: "Run the pytest assertions (true/false)"
        default: "true"
permissions:
  contents: read
jobs:
  realaudio:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LOCALAPPDATA: /home/runner/appdata
      ECHOMAP_MODELS: /home/runner/appdata/EchoMap/models
      ECHOMAP_REAL_AUDIO: /home/runner/real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pytest
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: /home/runner/appdata/EchoMap/models
          key: models-v1-birdnet31-geo304-asr1
      - run: python tools/fetch_models.py "$LOCALAPPDATA/EchoMap/models"
      - name: Cache real audio
        uses: actions/cache@v4
        with:
          path: /home/runner/real
          key: real-audio-${{ hashFiles('tools/make_real_audio.py') }}
      - run: test -f /home/runner/real/long_mix.wav || python tools/make_real_audio.py /home/runner/real
      - name: Profile
        run: |
          set +e
          mkdir -p /home/runner/out
          for m in ${{ inputs.modes || 'quick standard deep' }}; do for f in ${{ inputs.files || 'dutch_speech.wav street_dutch.wav long_mix.wav' }}; do
            echo "::group::$m $f"
            ECHOMAP_STACKDUMP=240 timeout -s KILL 1200 python -u tools/profile_case.py "/home/runner/real/$f" $m "/home/runner/out/${m}_${f}.json"
            echo "exit=$?"; echo "::endgroup::"
          done; done
          echo "=== SUMMARY ==="; cat /home/runner/out/*.json; echo
      - name: End-to-end assertions
        if: inputs.assert != 'false' && hashFiles('tests/test_real_pipeline.py') != ''
        run: python -m pytest -q tests/test_real_pipeline.py -rA
