name: test
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ECHOMAP_MODELS: /home/runner/models
      ECHOMAP_AUDIO: /home/runner/audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/models
          key: models-v1-birdnet31-geo304
      - run: python tools/fetch_models.py "$ECHOMAP_MODELS"
      - uses: actions/cache@v4
        with:
          path: /home/runner/audio
          key: audio-${{ hashFiles('tests/test_audio_manifest.json') }}
      - run: python tools/fetch_test_audio.py "$ECHOMAP_AUDIO"
      - name: Unit + real-audio tests
        run: python -m pytest -q -rA --durations=10 tests | tee pytest.txt
      - name: Evaluation summary
        if: always()
        run: |
          echo '## Test results' >> $GITHUB_STEP_SUMMARY
          tail -n 60 pytest.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```json' >> $GITHUB_STEP_SUMMARY; cat tests/_eval.json >> $GITHUB_STEP_SUMMARY || true; echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            pytest.txt
            tests/_eval.json
          retention-days: 30
