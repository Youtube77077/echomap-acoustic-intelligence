name: images
# Offline picture pack: one credited Wikimedia Commons thumbnail per AudioSet sound class, vehicle type and species
# (BirdNET+ and iNatSounds). Published as release images-v1 (EchoMap-images-v1.zip); build-windows attaches it to
# app releases. Runs on GitHub's machines only.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/images.yml", "tools/build_images.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      LOCALAPPDATA: /home/runner/appdata
      WIKIMEDIA_CONTACT: ${{ vars.WIKIMEDIA_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install requests==2.34.2 pillow==12.3.0
      - run: |
          mkdir -p m && gh release download models-v1 -p "audioset_labels.csv" -p "birdnet_v3_labels.csv" -D m
          gh release download inat-emb-v1 -p "train_0.categories.json" -D m 2>/dev/null || echo "no iNat categories yet"
      - run: python -u tools/build_images.py m EchoMap-images-v1.zip m/train_0.categories.json
      - run: |
          gh release view images-v1 >/dev/null 2>&1 || gh release create images-v1 --prerelease --title "EchoMap picture pack" --notes "Thumbnails (WebP, 128 px) from Wikimedia Commons via Wikidata P18, free licences only; credits in index.json. Put EchoMap-images-v1.zip next to EchoMap.exe or in the models folder."
          gh release upload images-v1 EchoMap-images-v1.zip --clobber
